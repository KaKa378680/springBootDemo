spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://localhost:3306/mydb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      max-active: 100
      min-idle: 5
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/*.xml
pagehelper:
  support-methods-arguments: true #支持通过mapper方法参数传递参数
  reasonable: true                #分页合理化（页码超出范围自动调整）
  helper-dialect: mysql            # 方言配置，根据你的数据库类型选择
